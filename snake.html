<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
  }
  .wrap {
    text-align: center;
  }
  h1 {
    font-size: 32px;
    letter-spacing: 4px;
    margin-bottom: 12px;
    text-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 16px;
    font-size: 18px;
  }
  .scoreboard span { color: #7fd8a4; font-weight: bold; }
  canvas {
    background: #101d24;
    border: 2px solid #2c5364;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .controls {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    background: #1f8a4c;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 16px;
    cursor: pointer;
    transition: transform .1s, background .2s;
  }
  button:hover { background: #26a75c; transform: translateY(-2px); }
  button:active { transform: scale(.96); }
  button.secondary { background: #3a5a6b; }
  button.secondary:hover { background: #4a7083; }
  .tip { margin-top: 14px; color: #9fb6c0; font-size: 14px; }
  .gameover {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .gameover.show { display: flex; }
  .box {
    background: #16242d;
    border: 2px solid #2c5364;
    border-radius: 14px;
    padding: 40px 60px;
    text-align: center;
  }
  .box h2 { font-size: 36px; color: #ff6b6b; margin-bottom: 12px; }
  .box p { font-size: 20px; margin-bottom: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 贪吃蛇</h1>
  <div class="scoreboard">
    <div>得分 <span id="score">0</span></div>
    <div>最高分 <span id="best">0</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="controls">
    <button id="btnUp">↑</button>
  </div>
  <div class="controls">
    <button id="btnLeft">←</button>
    <button id="btnStart">开始 / 暂停</button>
    <button id="btnRight">→</button>
  </div>
  <div class="controls">
    <button id="btnDown">↓</button>
  </div>
  <div class="tip">方向键 / WASD 移动 · 空格 开始/暂停</div>
</div>

<div class="gameover" id="overlay">
  <div class="box">
    <h2>游戏结束</h2>
    <p>得分 <span id="finalScore">0</span> · 最高分 <span id="finalBest">0</span></p>
    <button id="btnRestart">再来一局</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 20, SIZE = 20;
  const cols = canvas.width / GRID;

  let snake, dir, nextDir, food, score, best, running, paused, timer;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  document.getElementById('best').textContent = best;

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    document.getElementById('score').textContent = score;
    spawnFood();
    running = false;
    paused = false;
    document.getElementById('overlay').classList.remove('show');
  }

  function spawnFood() {
    do {
      food = {
        x: Math.floor(Math.random() * cols),
        y: Math.floor(Math.random() * cols)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function start() {
    reset();
    running = true;
    paused = false;
    if (timer) clearInterval(timer);
    timer = setInterval(step, 120);
  }

  function stop() {
    running = false;
    if (timer) clearInterval(timer);
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= cols) return gameOver();
    // 撞自己
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      document.getElementById('score').textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('snake_best', best);
        document.getElementById('best').textContent = best;
      }
      spawnFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    stop();
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('overlay').classList.add('show');
    draw();
  }

  function draw() {
    ctx.fillStyle = '#101d24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let i = 0; i <= cols; i++) {
      ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(canvas.width, i * GRID); ctx.stroke();
    }

    // 食物
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // 蛇
    snake.forEach((s, i) => {
      const g = i === 0 ? 0.25 : 0.25 + (i / snake.length) * 0.45;
      ctx.fillStyle = `rgb(${Math.round(70 + g * 160)}, ${Math.round(200 - g * 100)}, ${Math.round(90 + g * 60)})`;
      const pad = i === 0 ? 1 : 2;
      ctx.fillRect(s.x * GRID + pad, s.y * GRID + pad, GRID - pad * 2, GRID - pad * 2);
    });

    // 眼睛
    const h = snake[0];
    ctx.fillStyle = '#fff';
    const ex = h.x * GRID, ey = h.y * GRID;
    ctx.fillRect(ex + 5, ey + 5, 4, 4);
    ctx.fillRect(ex + 11, ey + 5, 4, 4);
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === ' ') {
      e.preventDefault();
      if (!running) start(); else togglePause();
    }
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    if (k === 'arrowdown' || k === 's') setDir(0, 1);
    if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    if (k === 'arrowright' || k === 'd') setDir(1, 0);
  });

  function setDir(x, y) {
    if (!running) { start(); }
    // 不能反向
    if (x === -dir.x && y === -dir.y) return;
    if (x === dir.x && y === dir.y) return;
    nextDir = { x, y };
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) clearInterval(timer);
    else timer = setInterval(step, 120);
  }

  document.getElementById('btnStart').addEventListener('click', () => {
    if (!running) start(); else togglePause();
  });
  document.getElementById('btnRestart').addEventListener('click', start);
  document.getElementById('btnUp').addEventListener('click', () => setDir(0, -1));
  document.getElementById('btnDown').addEventListener('click', () => setDir(0, 1));
  document.getElementById('btnLeft').addEventListener('click', () => setDir(-1, 0));
  document.getElementById('btnRight').addEventListener('click', () => setDir(1, 0));

  reset();
  draw();
})();
</script>
</body>
</html>
