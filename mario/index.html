	<body style="margin:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
		<div style="text-align:center;padding:10px;">
			<h1 style="color:#fff;font-size:28px;margin:0 0 6px 0;letter-spacing:2px;text-shadow:2px 2px 0 #e0432a;">🍄 无限马里奥</h1>
			<div style="color:#ffd93d;font-size:15px;margin-bottom:10px;">还原经典版 <b>8 个世界</b> · 城堡 <b>Boss 关</b> · 关卡无限生成</div>
			<canvas id="canvas" width="640" height="480" style="display:block;border:2px solid #333;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.6);">
				<p>Your browser does not support the canvas element.</p>
			</canvas>
			<div style="color:#ccc;font-size:14px;margin-top:12px;line-height:1.9;background:#161616;border:1px solid #333;border-radius:8px;padding:10px 18px;display:inline-block;text-align:left;">
				<b style="color:#fff;">🎮 操作说明</b><br>
				<span style="color:#7fd8a4;">【 ↑ 】</span> 跳跃<br>
				<span style="color:#7fd8a4;">【 ← → 】</span> 左右移动<br>
				<span style="color:#7fd8a4;">【 A 】</span> 加速跑<br>
				<span style="color:#7fd8a4;">【 S 】</span> 确认键（地图界面进入关卡）<br>
				<span style="color:#ffd93d;">💡</span> 标题画面按 <b>↑</b> 或 <b>S</b> 开始游戏
			</div>
		</div>
