<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏展示仓库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
  }
  .wrap { text-align: center; padding: 40px; }
  h1 { font-size: 38px; letter-spacing: 4px; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  p.desc { color: #9fb6c0; font-size: 16px; margin-bottom: 40px; }
  .cards { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
  .card {
    background: #16242d;
    border: 2px solid #2c5364;
    border-radius: 14px;
    padding: 30px 40px;
    width: 260px;
    text-decoration: none;
    color: #fff;
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .card .emoji { font-size: 52px; display: block; margin-bottom: 14px; }
  .card h2 { font-size: 24px; margin-bottom: 8px; }
  .card p { color: #9fb6c0; font-size: 14px; line-height: 1.6; }
  .footer { margin-top: 40px; color: #6a8290; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 游戏展示仓库</h1>
  <p class="desc">HTML5 网页小游戏合集 · 浏览器直接玩 · 无需安装</p>
  <div class="cards">
    <a class="card" href="snake.html">
      <span class="emoji">🐍</span>
      <h2>贪吃蛇</h2>
      <p>经典贪吃蛇，带最高分记录。方向键移动，空格开始。</p>
    </a>
    <a class="card" href="mario/index.html">
      <span class="emoji">🍄</span>
      <h2>无限马里奥</h2>
      <p>还原经典版 8 个世界 + 城堡 Boss 关，关卡无限生成。</p>
    </a>
  </div>
  <div class="footer">由 opencode 制作 · GitHub: Wz269002049/demo-repo</div>
</div>
</body>
</html>
